<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İSG Panosu</title>
<!--
  İSG DİJİTAL PANOSU — ESKİ TV TARAYICI UYUMLU SÜRÜM
  Google Sheets sekmeleri:
    Ayarlar:  anahtar | deger   (son_kaza_tarihi / rekor_gun / tesis_adi)
    SariKart: isim | adet
    TesisKart:tesis | adet
    Kurul:    tarih | karar | durum   (Açık/Devam/Kapandı)
    Kazalar:  tarih | tesis | tur | kayip_gun | detay
  SHEET_ID boşsa demo çalışır.
-->
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;overflow:hidden;}
  body{background:#0F1417;color:#EAEEF1;font-family:"Inter",Arial,sans-serif;-webkit-font-smoothing:antialiased;}
  .stripe{background-image:repeating-linear-gradient(-45deg,#F5C400 0,#F5C400 16px,#0F1417 16px,#0F1417 32px);}
  .app{height:100vh;width:100vw;display:flex;flex-direction:column;overflow:hidden;background:#0F1417;}

  .topbar{height:9vh;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 3vw;border-bottom:1px solid #2A343B;position:relative;}
  .progress{position:absolute;left:0;bottom:-1px;height:3px;background:#F5C400;width:0;}
  .brand{display:flex;align-items:center;}
  .brand .tag{width:12px;height:5vh;border-radius:3px;margin-right:1vw;}
  .brand h1{font-family:"Barlow Condensed",Arial,sans-serif;font-weight:700;font-size:3.4vh;letter-spacing:.06em;text-transform:uppercase;line-height:1;}
  .brand small{display:block;color:#8A97A0;font-size:1.35vh;letter-spacing:.28em;text-transform:uppercase;margin-top:.4vh;}
  .top-right{display:flex;align-items:center;}
  .dots{display:flex;margin-right:2.4vw;}
  .dots i{width:1vh;height:1vh;border-radius:50%;background:#2A343B;margin-left:.7vw;}
  .dots i.on{background:#F5C400;width:3vh;border-radius:3px;}
  .datebox{text-align:right;font-family:"Barlow Condensed",Arial,sans-serif;line-height:1.1;}
  .datebox .d1{font-size:2.6vh;font-weight:700;}
  .datebox .d2{color:#8A97A0;font-size:1.4vh;letter-spacing:.16em;text-transform:uppercase;margin-top:.3vh;}

  .stage{flex:1 1 auto;position:relative;overflow:hidden;}
  .page{position:absolute;top:0;left:0;right:0;bottom:0;padding:3.5vh 3vw;opacity:0;display:flex;flex-direction:column;}
  .page.active{opacity:1;}

  .ptitle{display:flex;align-items:center;margin-bottom:2.5vh;flex:0 0 auto;}
  .ptitle .ico{width:10px;height:4.4vh;border-radius:3px;margin-right:1vw;}
  .ptitle h2{font-family:"Barlow Condensed",Arial,sans-serif;font-weight:700;font-size:4vh;letter-spacing:.06em;text-transform:uppercase;}
  .ptitle .per{margin-left:auto;color:#8A97A0;font-size:2vh;letter-spacing:.16em;text-transform:uppercase;}

  .p-hero{align-items:center;justify-content:center;text-align:center;}
  .p-hero .badge-safe{font-family:"Barlow Condensed",Arial,sans-serif;font-weight:700;font-size:3vh;letter-spacing:.3em;color:#34C46A;text-transform:uppercase;}
  .p-hero .eyebrow{color:#8A97A0;font-family:"Barlow Condensed",Arial,sans-serif;font-weight:600;font-size:2.6vh;letter-spacing:.34em;text-transform:uppercase;margin-top:.5vh;}
  .plates{display:flex;margin:2.5vh 0 1.5vh;}
  .plate{background:#0B0F11;border-radius:14px;min-width:16vh;padding:1.5vh 2vh;margin:0 .7vw;font-family:"Barlow Condensed",Arial,sans-serif;font-weight:800;font-size:34vh;line-height:.9;color:#34C46A;text-shadow:0 0 34px rgba(52,196,106,.4);box-shadow:inset 0 -1vh 0 rgba(0,0,0,.45);}
  .p-hero .barline{height:1.4vh;width:52vw;border-radius:3px;margin:2.5vh 0;}
  .p-hero .meta{display:flex;color:#8A97A0;font-size:2.4vh;}
  .p-hero .meta div{margin:0 2.5vw;}
  .p-hero .meta b{color:#EAEEF1;font-weight:600;}

  .split{flex-direction:row;}
  .col{background:#171E23;border:1px solid #2A343B;border-radius:16px;padding:2.8vh 1.8vw;display:flex;flex-direction:column;overflow:hidden;}
  .col.left{flex:1.15;margin-right:2.5vw;} .col.right{flex:1;}
  .ch{display:flex;align-items:center;margin-bottom:2vh;flex:0 0 auto;}
  .ch .card-ico{width:2.4vh;height:3.4vh;background:#F5C400;border-radius:4px;margin-right:.8vw;box-shadow:0 0 16px rgba(245,196,0,.45);}
  .ch h3{font-family:"Barlow Condensed",Arial,sans-serif;font-weight:700;font-size:2.8vh;letter-spacing:.06em;text-transform:uppercase;}
  .ladder{flex:1;display:flex;flex-direction:column;justify-content:center;}
  .rank{display:flex;align-items:center;padding:1.15vh .5vw;border-bottom:1px solid #2A343B;}
  .rank .no{font-family:"Barlow Condensed",Arial,sans-serif;font-weight:700;font-size:3vh;color:#8A97A0;width:3.4vh;text-align:center;margin-right:1.2vw;}
  .rank .nm{flex:1;font-size:2.6vh;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rank .ct{font-family:"Barlow Condensed",Arial,sans-serif;font-weight:700;font-size:3.4vh;color:#F5C400;display:flex;align-items:center;}
  .rank .ct .k{width:1.8vh;height:2.6vh;background:#F5C400;border-radius:3px;margin-right:.6vw;}
  .rank.lead .no{color:#F5C400;} .rank.lead .nm{font-weight:700;}
  .fbars{flex:1;display:flex;flex-direction:column;justify-content:center;}
  .fbar{margin:1vh 0;}
  .fbar .fl{display:flex;justify-content:space-between;margin-bottom:.7vh;}
  .fbar .fn{font-size:2.4vh;font-weight:500;}
  .fbar .fv{font-family:"Barlow Condensed",Arial,sans-serif;font-weight:700;font-size:2.8vh;color:#F5C400;}
  .fbar .track{height:1.8vh;background:#1E262C;border-radius:10px;overflow:hidden;}
  .fbar .fill{height:100%;background:#F5C400;border-radius:10px;}

  .decwrap{flex:1;display:flex;flex-direction:column;justify-content:center;}
  .decision{display:flex;align-items:center;padding:2vh .5vw;border-bottom:1px solid #2A343B;}
  .decision .dt{color:#8A97A0;font-family:"Barlow Condensed",Arial,sans-serif;font-weight:600;font-size:2.6vh;white-space:nowrap;width:9vh;margin-right:1.4vw;}
  .decision .tx{flex:1;font-size:2.9vh;line-height:1.2;margin-right:1.4vw;}
  .badge{font-size:1.8vh;font-weight:600;padding:.5vh 1.2vw;border-radius:22px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;}
  .b-acik{background:rgba(245,196,0,.16);color:#F5C400;}
  .b-devam{background:rgba(125,176,255,.16);color:#7DB0FF;}
  .b-kapandi{background:rgba(52,196,106,.16);color:#34C46A;}

  .kpis{display:flex;flex:0 0 auto;margin-bottom:3vh;}
  .kpi{flex:1;background:#171E23;border:1px solid #2A343B;border-radius:14px;padding:2.4vh 1.6vw;margin-right:2vw;}
  .kpi.last{margin-right:0;}
  .kpi .n{font-family:"Barlow Condensed",Arial,sans-serif;font-weight:800;font-size:8vh;line-height:.85;}
  .kpi.red .n{color:#FF5236;} .kpi.amber .n{color:#F5C400;} .kpi.neutral .n{color:#EAEEF1;}
  .kpi .l{color:#8A97A0;font-size:1.9vh;letter-spacing:.08em;text-transform:uppercase;margin-top:1vh;}
  .kcards{flex:1;display:flex;flex-direction:column;justify-content:center;}
  .kcard{display:flex;align-items:center;background:#171E23;border:1px solid #2A343B;border-left:4px solid #FF5236;border-radius:12px;padding:2.2vh 1.8vw;margin:.9vh 0;}
  .kcard .mon{font-family:"Barlow Condensed",Arial,sans-serif;font-weight:700;font-size:3.4vh;color:#8A97A0;width:11vh;text-transform:uppercase;}
  .kcard .fac{flex:1;font-size:3vh;font-weight:600;}
  .kcard .typ{font-size:1.9vh;font-weight:600;padding:.6vh 1.2vw;border-radius:22px;background:rgba(255,82,54,.14);color:#FF5236;letter-spacing:.05em;text-transform:uppercase;margin:0 1.4vw;}
  .kcard .day{font-family:"Barlow Condensed",Arial,sans-serif;font-weight:700;font-size:3vh;color:#EAEEF1;width:12vh;text-align:right;}
  .kcard .day small{display:block;font-family:"Inter",Arial,sans-serif;font-weight:400;font-size:1.5vh;color:#8A97A0;text-transform:uppercase;letter-spacing:.1em;}
  .months{display:flex;flex:0 0 auto;margin-top:2.5vh;}
  .months .m{flex:1;text-align:center;padding:1vh 0;border-radius:8px;background:#171E23;border:1px solid #2A343B;font-family:"Barlow Condensed",Arial,sans-serif;font-weight:600;font-size:1.8vh;color:#8A97A0;margin:0 .3vw;}
  .months .m.hit{background:rgba(255,82,54,.16);border-color:rgba(255,82,54,.4);color:#FF5236;}

  .empty{color:#8A97A0;font-size:2.4vh;text-align:center;padding:4vh 0;}
  .foot{position:fixed;bottom:.6vh;right:1.2vw;color:#3E4A52;font-size:1.15vh;letter-spacing:.1em;}
</style>
</head>
<body style="background:#0F1417;">
<div class="app">
  <div class="topbar">
    <div class="brand">
      <div class="tag stripe"></div>
      <div><h1 id="tesisAdi">İSG PANOSU</h1><small>İş Sağlığı ve Güvenliği · Canlı Pano</small></div>
    </div>
    <div class="top-right">
      <div class="dots" id="dots"></div>
      <div class="datebox"><div class="d1" id="d1">—</div><div class="d2" id="d2">—</div></div>
    </div>
    <div class="progress" id="progress"></div>
  </div>

  <div class="stage">
    <div class="page p-hero active">
      <div class="badge-safe" id="safeBadge">GÜVENDEYİZ</div>
      <div class="eyebrow">Kazasız Gün</div>
      <div class="plates" id="plates"></div>
      <div class="barline stripe"></div>

        <div>Rekor: <b id="rekor">—</b> gün</div>

      <div class="col right">
        <div class="ch"><div class="card-ico"></div><h3>Sarı Kart · Tesis Dağılımı</h3></div>

      </div>
    </div>

    <div class="page">
      <div class="ptitle"><div class="ico" style="background:#F5C400;"></div><h2>Kurul Kararları</h2></div>

    </div>

    <div class="page">
      <div class="ptitle"><div class="ico" style="background:#FF5236;"></div><h2>Kaza Takibi</h2><div class="per" id="kazaYil">2026</div></div>

        <div class="kpi red"><div class="n" id="kpiKzk">0</div><div class="l">Kayıp Zamanlı Kaza</div></div>
        <div class="kpi amber"><div class="n" id="kpiGun">0</div><div class="l">Toplam Kayıp Gün</div></div>
        <div class="kpi neutral last"><div class="n" id="kpiBirim">0</div><div class="l">Etkilenen Birim</div></div>
      </div>
      <div class="kcards" id="kazaCards"></div>
      <div class="months" id="months"></div>
    </div>
  </div>
</div>
<div class="foot" id="foot">demo mod</div>

<script>
var SHEET_ID = "";
var REFRESH_SANIYE = 300;
var SAYFA_SANIYE = 12;
var YIL = 2026;
var SEKME = { ayarlar:"Ayarlar", sariKart:"SariKart", tesisKart:"TesisKart", kurul:"Kurul", kazalar:"Kazalar" };

var AYLAR = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
var AYKISA = ["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];
var GUNLER = ["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];

var DEMO = {
  ayarlar:{ son_kaza_tarihi:"2026-04-06", rekor_gun:"210", tesis_adi:"BETEK" },
  sariKart:[
    {isim:"Ahmet Yılmaz",adet:14},{isim:"Mehmet Demir",adet:11},{isim:"Ayşe Kaya",adet:9},
    {isim:"Hasan Çelik",adet:7},{isim:"Fatma Şahin",adet:6},{isim:"Ali Aydın",adet:5},{isim:"Zeynep Arslan",adet:4}
  ],
  tesisKart:[
    {tesis:"Gebze",adet:38},{tesis:"Balıkesir",adet:22},{tesis:"Kayseri",adet:17},{tesis:"Alfa Kimya",adet:12},{tesis:"Merkez",adet:8}
  ],
  kurul:[
    {tarih:"2026-06-28",karar:"Yükleme rampasına korkuluk montajı yapılacak",durum:"Açık"},
    {tarih:"2026-06-20",karar:"Forklift operatörlerine tazeleme eğitimi verilecek",durum:"Devam"},
    {tarih:"2026-06-10",karar:"Depo yangın tüpleri kontrol edildi",durum:"Kapandı"},
    {tarih:"2026-06-02",karar:"Acil çıkış tabelaları yenilendi",durum:"Kapandı"}
  ],
  kazalar:[
    {tarih:"2026-02-11",tesis:"İdari İşler",tur:"Kayıp Zamanlı",kayip_gun:4,detay:"Düşme"},
    {tarih:"2026-04-06",tesis:"Yatırımlar",tur:"Kayıp Zamanlı",kayip_gun:9,detay:"Sıkışma"}
  ]
};

function byId(id){ return document.getElementById(id); }

function parseCSV(t){
  var R=[], row=[], v="", q=false, i, c;
  for(i=0;i<t.length;i++){
    c=t.charAt(i);
    if(q){
      if(c==='"'){ if(t.charAt(i+1)==='"'){ v+='"'; i++; } else { q=false; } }
      else { v+=c; }
    } else {
      if(c==='"'){ q=true; }
      else if(c===','){ row.push(v); v=""; }
      else if(c==='\n'){ row.push(v); R.push(row); row=[]; v=""; }
      else if(c==='\r'){}
      else { v+=c; }
    }
  }
  if(v.length||row.length){ row.push(v); R.push(row); }
  return R;
}
function toObjects(rows){
  if(!rows.length) return [];
  var head=[], i, out=[];
  for(i=0;i<rows[0].length;i++){ head.push((""+rows[0][i]).replace(/^\s+|\s+$/g,"").toLowerCase()); }
  for(i=1;i<rows.length;i++){
    var r=rows[i], any=false, j, o={};
    for(j=0;j<r.length;j++){ if((""+r[j]).replace(/^\s+|\s+$/g,"")!==""){ any=true; } }
    if(!any) continue;
    for(j=0;j<head.length;j++){ o[head[j]]=(""+(r[j]||"")).replace(/^\s+|\s+$/g,""); }
    out.push(o);
  }
  return out;
}
function xhrGet(url, cb){
  var x=new XMLHttpRequest();
  x.open("GET", url, true);
  x.onreadystatechange=function(){
    if(x.readyState===4){
      if(x.status>=200 && x.status<300){ cb(null, x.responseText); }
      else { cb(new Error("http "+x.status), null); }
    }
  };
  x.send();
}
function sheetUrl(tab){
  return "https://docs.google.com/spreadsheets/d/"+SHEET_ID+"/gviz/tq?tqx=out:csv&sheet="+encodeURIComponent(tab);
}

function gunFarki(iso){
  var p=(""+iso).split("-");
  if(p.length<3) return 0;
  var d=new Date(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2],10));
  if(isNaN(d.getTime())) return 0;
  var now=new Date(); now.setHours(0,0,0,0);
  var diff=Math.floor((now.getTime()-d.getTime())/86400000);
  return diff>0?diff:0;
}
function ayIndex(iso){
  var p=(""+iso).split("-");
  if(p.length<2) return -1;
  var m=parseInt(p[1],10)-1;
  return (m>=0&&m<12)?m:-1;
}
function trTarihUzun(iso){
  var p=(""+iso).split("-");
  if(p.length<3) return iso||"—";
  var g=parseInt(p[2],10), m=parseInt(p[1],10)-1, y=p[0];
  if(isNaN(g)||m<0||m>11) return iso;
  return (g<10?"0"+g:g)+" "+AYLAR[m]+" "+y;
}
function badgeClass(d){
  var t=(""+d).toLowerCase();
  if(t.indexOf("kapan")>=0) return "b-kapandi";
  if(t.indexOf("devam")>=0) return "b-devam";
  return "b-acik";
}
function esc(s){ return (""+s); }
function bySayiDesc(k){ return function(a,b){ return (b[k]||0)-(a[k]||0); }; }
function byTarihDesc(a,b){ return (""+(b.tarih||"")<""+(a.tarih||""))?-1:((""+(b.tarih||"")>""+(a.tarih||""))?1:0); }
function byTarihAsc(a,b){ return (""+(a.tarih||"")<""+(b.tarih||""))?-1:((""+(a.tarih||"")>""+(b.tarih||""))?1:0); }

function render(data){
  var a=data.ayarlar||{}, i;
  if(a.tesis_adi){ byId("tesisAdi").innerHTML=esc((a.tesis_adi+" İSG PANOSU").toUpperCase()); }
  var gun=gunFarki(a.son_kaza_tarihi);
  var ps="", gs=""+gun;
  for(i=0;i<gs.length;i++){ ps+='<div class="plate">'+gs.charAt(i)+'</div>'; }
  byId("plates").innerHTML=ps;
  byId("rekor").innerHTML=esc(a.rekor_gun||"—");
  byId("sonKaza").innerHTML=esc(trTarihUzun(a.son_kaza_tarihi));
  byId("safeBadge").innerHTML=(a.rekor_gun && gun>=parseInt(a.rekor_gun,10))?"YENİ REKOR!":"GÜVENDEYİZ";

  var sk=(data.sariKart||[]).slice();
  for(i=0;i<sk.length;i++){ sk[i].adet=parseInt(sk[i].adet,10)||0; }
  sk.sort(bySayiDesc("adet")); sk=sk.slice(0,7);
  var h="";
  for(i=0;i<sk.length;i++){
    h+='<div class="rank'+(i===0?' lead':'')+'"><div class="no">'+(i+1)+'</div><div class="nm">'+esc(sk[i].isim||"")+'</div><div class="ct"><span class="k"></span>'+sk[i].adet+'</div></div>';
  }
  byId("liderlik").innerHTML=h||'<div class="empty">Kayıt yok</div>';

  var tk=(data.tesisKart||[]).slice();
  for(i=0;i<tk.length;i++){ tk[i].adet=parseInt(tk[i].adet,10)||0; }
  tk.sort(bySayiDesc("adet")); tk=tk.slice(0,6);
  var mx=1; for(i=0;i<tk.length;i++){ if(tk[i].adet>mx) mx=tk[i].adet; }
  h="";
  for(i=0;i<tk.length;i++){
    var w=Math.round(tk[i].adet/mx*100);
    h+='<div class="fbar"><div class="fl"><span class="fn">'+esc(tk[i].tesis||"")+'</span><span class="fv">'+tk[i].adet+'</span></div><div class="track"><div class="fill" style="width:'+w+'%"></div></div></div>';
  }
  byId("tesisBars").innerHTML=h||'<div class="empty">Kayıt yok</div>';

  var kr=(data.kurul||[]).slice(); kr.sort(byTarihDesc); kr=kr.slice(0,6);
  h="";
  for(i=0;i<kr.length;i++){
    var dt=(""+(kr[i].tarih||"")).substring(5).replace("-",".");
    h+='<div class="decision"><div class="dt">'+dt+'</div><div class="tx">'+esc(kr[i].karar||"")+'</div><div class="badge '+badgeClass(kr[i].durum)+'">'+esc(kr[i].durum||"Açık")+'</div></div>';
  }
  byId("kararlar").innerHTML=h||'<div class="empty">Kayıt yok</div>';

  byId("kazaYil").innerHTML=YIL;
  var allkz=(data.kazalar||[]), kz=[];
  for(i=0;i<allkz.length;i++){ if((""+(allkz[i].tarih||"")).indexOf(""+YIL)===0){ kz.push(allkz[i]); } }
  var kzk=0, toplamGun=0, birimMap={}, birimSay=0;
  for(i=0;i<kz.length;i++){
    if((""+(kz[i].tur||"")).toLowerCase().indexOf("kayıp zaman")>=0){ kzk++; }
    toplamGun+=parseInt(kz[i].kayip_gun,10)||0;
    var tb=kz[i].tesis||"";
    if(tb && !birimMap[tb]){ birimMap[tb]=1; birimSay++; }
  }
  byId("kpiKzk").innerHTML=kzk;
  byId("kpiGun").innerHTML=toplamGun;
  byId("kpiBirim").innerHTML=birimSay;
  var ks=kz.slice(); ks.sort(byTarihAsc);
  h="";
  for(i=0;i<ks.length;i++){
    var mi=ayIndex(ks[i].tarih); if(mi<0) mi=0;
    var gg=parseInt(ks[i].kayip_gun,10)||0;
    h+='<div class="kcard"><div class="mon">'+AYLAR[mi]+'</div><div class="fac">'+esc(ks[i].tesis||"—")+'</div><div class="typ">'+esc(ks[i].tur||"Olay")+'</div><div class="day">'+gg+'<small>Kayıp Gün</small></div></div>';
  }
  byId("kazaCards").innerHTML=h||'<div class="empty">Bu yıl kayıtlı kaza yok — tüm tesisler temiz</div>';
  var hit={};
  for(i=0;i<kz.length;i++){ var mm=ayIndex(kz[i].tarih); if(mm>=0){ hit[mm]=1; } }
  h="";
  for(i=0;i<12;i++){ h+='<div class="m'+(hit[i]?' hit':'')+'">'+AYKISA[i]+'</div>'; }
  byId("months").innerHTML=h;
}

function load(){
  var foot=byId("foot");
  if(!SHEET_ID){ render(DEMO); foot.innerHTML="demo mod · Sheet ID girilmedi"; return; }
  var tabs=[SEKME.ayarlar,SEKME.sariKart,SEKME.tesisKart,SEKME.kurul,SEKME.kazalar];
  var results={}, done=0, failed=false, k;
  function after(){
    done++;
    if(done<tabs.length) return;
    if(failed){ render(DEMO); foot.innerHTML="bağlantı hatası · demo gösteriliyor"; return; }
    var ayarlar={}, ay=results[SEKME.ayarlar]||[], i;
    for(i=0;i<ay.length;i++){ if(ay[i].anahtar){ ayarlar[ay[i].anahtar]=ay[i].deger; } }
    render({ ayarlar:ayarlar, sariKart:results[SEKME.sariKart]||[], tesisKart:results[SEKME.tesisKart]||[], kurul:results[SEKME.kurul]||[], kazalar:results[SEKME.kazalar]||[] });
    foot.innerHTML="veri güncellendi";
  }
  for(k=0;k<tabs.length;k++){
    (function(tab){
      xhrGet(sheetUrl(tab), function(err, txt){
        if(err){ failed=true; } else { try{ results[tab]=toObjects(parseCSV(txt)); }catch(e){ failed=true; } }
        after();
      });
    })(tabs[k]);
  }
}

function setDate(){
  var n=new Date();
  byId("d1").innerHTML=(n.getDate()<10?"0"+n.getDate():n.getDate())+" "+AYLAR[n.getMonth()];
  byId("d2").innerHTML=GUNLER[n.getDay()]+" "+n.getFullYear();
}

var pages, dots, idx=0, prog;
function initPages(){
  var i, ndc=document.querySelectorAll(".page");
  pages=[];
  for(i=0;i<ndc.length;i++){ pages.push(ndc[i]); }
  var dh="";
  for(i=0;i<pages.length;i++){ dh+='<i'+(i===0?' class="on"':'')+'></i>'; }
  byId("dots").innerHTML=dh;
  var di=byId("dots").getElementsByTagName("i");
  dots=[];
  for(i=0;i<di.length;i++){ dots.push(di[i]); }
  prog=byId("progress");
}
function restartProgress(){
  prog.style.transition="none"; prog.style.width="0";
  if(prog.offsetWidth){}
  setTimeout(function(){
    prog.style.transition="width "+SAYFA_SANIYE+"s linear";
    prog.style.width="100%";
  },30);
}
function goto(i){
  pages[idx].className=pages[idx].className.replace(" active","");
  dots[idx].className="";
  idx=(i+pages.length)%pages.length;
  pages[idx].className+=" active";
  dots[idx].className="on";
  restartProgress();
}

setDate();
setInterval(setDate,60000);
load();
setInterval(load, REFRESH_SANIYE*1000);
initPages();
restartProgress();
setInterval(function(){ goto(idx+1); }, SAYFA_SANIYE*1000);
</script>
</body>
</html>
