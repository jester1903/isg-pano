<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>SSSP TEST</title>
<style type="text/css">
  html,body{margin:0;padding:0;background:#FFD400;color:#111111;
    font-family:Arial,Helvetica,sans-serif;text-align:center;}
  #big{font-size:70px;font-weight:bold;padding-top:60px;}
  #sub{font-size:34px;padding-top:20px;color:#333333;}
  #clock{font-size:48px;padding-top:30px;color:#000000;}
  #veri{font-size:40px;padding-top:40px;font-weight:bold;color:#0a3d0a;
    background:#ffffff;margin:40px 80px;padding:30px;border:6px solid #111111;}
  .err{color:#a01010 !important;}
</style>
</head>
<body>
  <div id="big">SSSP TEST</div>
  <div id="sub">Bu sarı ekrani goruyorsan: EKRAN CIZIYOR</div>
  <div id="clock">saat bekleniyor...</div>
  <div id="veri">VERI: baglaniliyor...</div>

<script type="text/javascript">
  // 1) JavaScript calisiyor mu? -> saat guncellenir
  function tik(){
    var d=new Date();
    var s=(d.getHours()<10?"0":"")+d.getHours()+":"+
          (d.getMinutes()<10?"0":"")+d.getMinutes()+":"+
          (d.getSeconds()<10?"0":"")+d.getSeconds();
    document.getElementById("clock").innerHTML="JavaScript OK - saat "+s;
  }
  tik();
  setInterval(tik,1000);

  // 2) HTTPS ile Google Sheet'e ulasabiliyor mu?
  var SHEET_ID="1LvAWduebolUylKrcKdlSQfkMmrHsgbs6MQH1JTKUBmU";
  var url="https://docs.google.com/spreadsheets/d/"+SHEET_ID+
          "/gviz/tq?tqx=out:csv&sheet=Ayarlar";
  var el=document.getElementById("veri");
  try{
    var x=new XMLHttpRequest();
    x.open("GET",url,true);
    x.onreadystatechange=function(){
      if(x.readyState===4){
        if(x.status>=200 && x.status<300){
          el.innerHTML="VERI OK - Google'a ulasildi ("+x.responseText.length+" karakter)";
        }else{
          el.className="err";
          el.innerHTML="VERI HATASI - HTTP "+x.status+" (HTTPS/aglar sorunu)";
        }
      }
    };
    x.send();
  }catch(e){
    el.className="err";
    el.innerHTML="VERI HATASI - "+e.message;
  }
</script>
</body>
</html>
